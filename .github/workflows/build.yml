name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Unit tests, lint and unsigned builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Validate release metadata
        run: bash scripts/check-version-sync.sh

      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Android lint
        run: bash ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Build debug and unsigned release APKs
        run: bash ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --console=plain

      - name: Inspect APK identities and permissions
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          VERSION=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          CODE=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)
          mapfile -t DEBUGS < <(find app/build/outputs/apk/debug -type f -name '*-debug.apk' | sort)
          mapfile -t RELEASES < <(find app/build/outputs/apk/release -type f -name '*-release.apk' | sort)
          test "${#DEBUGS[@]}" -eq 1
          test "${#RELEASES[@]}" -eq 1
          DEBUG=${DEBUGS[0]}
          RELEASE=${RELEASES[0]}
          "$AAPT" dump badging "$DEBUG" | tee /tmp/debug-badging.txt
          "$AAPT" dump badging "$RELEASE" | tee /tmp/release-badging.txt
          grep -Fq "package: name='app.appsperms.debug' versionCode='$CODE' versionName='$VERSION'" /tmp/debug-badging.txt
          grep -Fq "package: name='app.appsperms' versionCode='$CODE' versionName='$VERSION'" /tmp/release-badging.txt
          for apk in "$DEBUG" "$RELEASE"; do
            permissions="/tmp/$(basename "$apk").permissions"
            "$AAPT" dump permissions "$apk" > "$permissions"
            if grep -Fq android.permission.INTERNET "$permissions"; then
              echo "::error::$apk unexpectedly requests android.permission.INTERNET"
              exit 1
            fi
          done
          "$APKSIGNER" verify "$DEBUG"
          if "$APKSIGNER" verify "$RELEASE"; then
            echo "::error::Untrusted CI unexpectedly produced a signed release APK"
            exit 1
          fi

      - name: Upload CI APKs and reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-ci-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14

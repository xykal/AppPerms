name: Build APK - Fixed Resilient Hosting (Anti-Suspend)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fixed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK (debug + release) + Deploy Resilient
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Siapkan keystore release
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "keystore release tersedia ✓"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret KEYSTORE_BASE64 belum ada — build release dilewati, hanya debug."
          fi

      - name: Unit test
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Build debug
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build release (signed + minified)
        if: steps.keystore.outputs.have == 'yes'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Kumpulkan artefak + copy ke docs/apk untuk Cloudflare Pages direct hosting
        id: artifact
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          NAME="AppsPerms-$VERSION"
          mkdir -p out
          mkdir -p docs/apk

          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$DEBUG_APK" "out/$NAME-debug.apk"
          cp "$DEBUG_APK" "docs/apk/$NAME-debug.apk"
          cp "$DEBUG_APK" "docs/apk/AppsPerms-debug-latest.apk"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/$NAME-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "docs/apk/$NAME-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "docs/apk/AppsPerms-latest.apk"
            cp app/build/outputs/apk/release/app-release.apk "docs/apk/AppsPerms-$VERSION-release.apk"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

          # SHA256 untuk verifikasi
          for f in docs/apk/*.apk; do
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")" 
          done > docs/apk/SHA256SUMS
          cat docs/apk/SHA256SUMS

          # Release notes
          {
            echo "APK **AppsPerms** — pengelola AppOps + Tuning via Shizuku."
            echo
            echo "### 📦 Hosting Baru (Anti-Suspend)"
            echo "- APK sekarang di-host langsung di Cloudflare Pages \`/apk/\` — tidak lagi bergantung ke akun xykalnotkel yang ke-suspend"
            echo "- Mirror: GitHub Releases aktif di xykal/AppPerms + Cloudflare Pages"
            echo
            echo "- \`$NAME-release.apk\` → signed keystore resmi, di-minify (R8), **disarankan**"
            echo "- \`$NAME-debug.apk\` → buat troubleshooting"
            echo
            echo "| berkas | ukuran | sha256 |"
            echo "|---|---|---|"
            for f in out/*.apk; do
              printf '| `%s` | %s | `%s` |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "> ⚠️ **Mulai v1.3.0 nama paketnya berubah** (\`app.overlayops\` → \`app.appsperms\`). Uninstall versi lama dulu."
            echo
            echo "Situs: https://appsperms.xyverse.my.id/ · direct APK: https://appsperms.xyverse.my.id/apk/AppsPerms-latest.apk"
          } > out/release-notes.md

          ls -lh out
          ls -lh docs/apk/

      - name: Scan VirusTotal & perbarui data situs (hanya rilis bertag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -uo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          REL_APK="out/AppsPerms-$VERSION-release.apk"
          DBG_APK="out/AppsPerms-$VERSION-debug.apk"
          REL_SHA=$(sha256sum "$REL_APK" | cut -d' ' -f1)
          DBG_SHA=$(sha256sum "$DBG_APK" | cut -d' ' -f1)
          REL_MB=$(python3 -c "import os;print(round(os.path.getsize('$REL_APK')/1048576,2))")
          DBG_MB=$(python3 -c "import os;print(round(os.path.getsize('$DBG_APK')/1048576,2))")
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          V3=https://www.virustotal.com/api/v3
          PERMA="https://www.virustotal.com/gui/file/$REL_SHA"
          CHECKED=false; DET=0; TOT=0

          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::warning::Secret VT_API_KEY belum diset — scan VirusTotal dilewati; hash & ukuran tetap diperbarui."
          else
            H="X-Apikey: $VT_API_KEY"
            J=$(curl -sL -H "$H" "$V3/files/$REL_SHA" || true)
            AID=""
            if jq -e '.data.attributes.last_analysis_stats' >/dev/null 2>&1 <<<"$J"; then
              echo "file sudah dikenal VirusTotal (hash sama) — pakai hasil terakhir"
            else
              POST=$(curl -sL -H "$H" -F file=@$REL_APK "$V3/files" || true)
              AID=$(jq -r '.data.id // empty' <<<"$POST")
              [ -n "$AID" ] || echo "::warning::submit VT gagal: $(jq -r '.error.message // "?"' <<<"$POST") — pakai hasil terakhir yang ada bila ada"
            fi
            if [ -n "$AID" ]; then
              for i in $(seq 1 20); do
                ST=$(curl -sL -H "$H" "$V3/analyses/$AID" | jq -r '.data.attributes.status // "?"')
                echo "analisis: $ST ($i/20)"
                [ "$ST" = "completed" ] && break
                sleep 15
              done
              AN=$(curl -sL -H "$H" "$V3/analyses/$AID" || true)
              DET=$(jq -r '[(.data.attributes.stats.malicious // 0), (.data.attributes.stats.suspicious // 0)] | add' <<<"$AN")
              TOT=$(jq -r '[.data.attributes.stats | (.malicious // 0) + (.suspicious // 0) + (.undetected // 0) + (.harmless // 0)] | add' <<<"$AN")
              if [ "${TOT:-0}" -gt 0 ]; then
                CHECKED=true
              else
                J=$(curl -sL -H "$H" "$V3/files/$REL_SHA" || true)
              fi
            fi
            if [ "$CHECKED" != "true" ] && jq -e '.data.attributes.last_analysis_stats' >/dev/null 2>&1 <<<"$J"; then
              DET=$(jq -r '[(.data.attributes.last_analysis_stats.malicious // 0), (.data.attributes.last_analysis_stats.suspicious // 0)] | add' <<<"$J")
              TOT=$(jq -r '[.data.attributes.last_analysis_stats | (.malicious // 0) + (.suspicious // 0) + (.undetected // 0) + (.harmless // 0)] | add' <<<"$J")
              CHECKED=true
            fi
          fi

          jq -n --arg v "$VERSION" --arg now "$NOW" \
             --arg rfile "AppsPerms-$VERSION-release.apk" --arg dfile "AppsPerms-$VERSION-debug.apk" \
             --arg rsha "$REL_SHA" --arg dsha "$DBG_SHA" --argjson rmb "$REL_MB" --argjson dmb "$DBG_MB" \
             --argjson checked "$CHECKED" --argjson det "$DET" --argjson tot "$TOT" --arg perma "$PERMA" \
             '{updated_utc:$now, version:$v, generated_by:"GitHub Actions build.yml (otomatis tiap tag v*) - FIXED hosting",
               release:{file:$rfile, sha256:$rsha, size_mb:$rmb, direct_url:"/apk/AppsPerms-latest.apk"},
               debug:{file:$dfile, sha256:$dsha, size_mb:$dmb, direct_url:"/apk/AppsPerms-debug-latest.apk"},
               virustotal:{checked:$checked, detected:$det, total:$tot, permalink:$perma, checked_utc:$now},
               hosting:{primary:"Cloudflare Pages /apk/", fallback:"GitHub xykal/AppPerms", anti_suspend:true}}' \
             > docs/data/virustotal.json
          cp docs/data/virustotal.json out/virustotal.json

          if [ "$CHECKED" = "true" ]; then
            if python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow; then
              python3 docs/tools/make-vt-card.py --data docs/data/virustotal.json --out docs/images/virustotal-report.png \
                && cp docs/images/virustotal-report.png out/virustotal-report.png
            fi
          fi

          {
            echo
            echo "### 🔐 Audit VirusTotal (scan otomatis CI)"
            if [ "$CHECKED" = "true" ]; then
              echo "- Hasil rilis ini: **$DET / $TOT**$( [ "$DET" -eq 0 ] && echo ' — CLEAN ✅')"
              echo "- Detail: $PERMA"
            else
              echo "- Scan otomatis **dilewati** (secret \`VT_API_KEY\` belum diset). Scan manual: $PERMA"
            fi
            echo "- SHA-256 release APK: \`$REL_SHA\`"
            echo "- Direct hosting: \`/apk/AppsPerms-latest.apk\` (Cloudflare Pages, anti-suspend)"
          } >> out/release-notes.md

          git add docs/data/virustotal.json docs/apk/
          [ -f out/virustotal-report.png ] && git add docs/images/virustotal-report.png
          if ! git diff --cached --quiet; then
            git -c user.name="AppsPerms CI" -c user.email="appsperms-ci@xykal.local" \
                commit -q -m "docs: hasil build v$VERSION + APK direct hosting anti-suspend (otomatis CI)"
            git push "https://github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/main \
              || echo "::warning::push docs gagal — file tetap ada di artefak build."
          fi

      - name: Upload artifact (APK + data)
        uses: actions/upload-artifact@v4
        with:
          name: AppsPerms-${{ github.run_number }}-fixed
          path: |
            out/*
            docs/apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Release ke GitHub aktif xykal/AppPerms (bukan xykalnotkel yang suspend)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/virustotal-report.png
            out/virustotal.json
          generate_release_notes: true
          body_path: out/release-notes.md
          # Pastikan repo ini adalah xykal/AppPerms yang aktif
          # Kalau masih di repo lama yang suspend, release akan gagal -> itu tanda harus migrasi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy ke Cloudflare Pages (primary hosting anti-suspend)
        if: always() && !cancelled()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: appsperms
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Secret CLOUDFLARE_API_TOKEN/ACCOUNT_ID belum diset — lewati publish Pages."
            echo "APK sudah ada di docs/apk/ dan akan ter-publish saat push ke main (via Pages Git integration)"
            exit 0
          fi
          npx --yes wrangler@3 pages deploy docs \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true

      - name: (Opsional) Upload ke R2 bucket untuk dl subdomain
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: appsperms-apk
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Skip R2 upload - no token"
            exit 0
          fi
          # Upload ke R2 jika bucket ada
          for f in out/*.apk; do
            base=$(basename "$f")
            echo "Upload $base ke R2 $R2_BUCKET..."
            npx --yes wrangler@3 r2 object put "$R2_BUCKET/$base" --file="$f" --content-type="application/vnd.android.package-archive" || echo "R2 upload gagal untuk $base (bucket mungkin belum dibuat)"
            # Juga upload sebagai latest
            if [[ "$base" == *"-release.apk" ]]; then
              npx --yes wrangler@3 r2 object put "$R2_BUCKET/AppsPerms-latest.apk" --file="$f" --content-type="application/vnd.android.package-archive" || true
            fi
            if [[ "$base" == *"-debug.apk" ]]; then
              npx --yes wrangler@3 r2 object put "$R2_BUCKET/AppsPerms-debug-latest.apk" --file="$f" --content-type="application/vnd.android.package-archive" || true
            fi
          done

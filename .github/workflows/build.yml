name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Siapkan artefak (universal + ABI)
        id: artifact
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          NAME="OverlayOps-$VERSION"
          mkdir -p out

          cp "$APK" "out/$NAME-debug.apk"

          # Deteksi apakah APK punya native library
          if unzip -l "$APK" | grep -qE 'lib/(arm|x86)'; then
            echo "native=yes" >> "$GITHUB_OUTPUT"
            echo "APK punya native lib -> bikin varian per-ABI"

            sign_abi() {
              ABI="$1"; OUT="out/$NAME-$ABI.apk"
              cp "$APK" "$OUT"
              for OTHER in arm64-v8a armeabi-v7a x86 x86_64; do
                if [ "$OTHER" != "$ABI" ]; then zip -q -d "$OUT" "lib/$OTHER/*" >/dev/null 2>&1 || true; fi
              done
              # hapus signature lama, sejajarkan, lalu tanda tangan ulang pakai debug keystore runner
              zip -q -d "$OUT" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
              BT="$ANDROID_HOME/build-tools/34.0.0"
              "$BT/zipalign" -f -p 4 "$OUT" "$OUT.aligned"
              KS="$RUNNER_TEMP/debug.keystore"
              keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
              "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
                --ks-key-alias androiddebugkey --out "$OUT" "$OUT.aligned"
              rm -f "$OUT.aligned"
              echo "  -> $OUT"
            }

            for ABI in arm64-v8a armeabi-v7a x86 x86_64; do sign_abi "$ABI"; done
          else
            echo "native=no" >> "$GITHUB_OUTPUT"
            cat > out/CATATAN-ABI.txt <<EOF
          $NAME tidak mengandung native library (.so) — semuanya kode Java/Kotlin.
          Artinya SATU APK ini jalan di semua arsitektur:
            - armeabi-v7a  (32-bit ARM)   ✔
            - arm64-v8a    (64-bit ARM)   ✔
            - x86 / x86_64 (emulator)     ✔
          Jadi tidak perlu build terpisah per-ABI; file per-ABI akan identik byte-per-byte.
          Silakan pakai: $NAME-debug.apk
          (Workflow ini otomatis bikin varian per-ABI kalau nanti ada .so ditambahkan.)
          EOF
          fi

          # ringkasan di Step Summary
          {
            echo "## Hasil build OverlayOps $VERSION"
            echo
            echo "| file | ukuran | sha256 |"
            echo "|---|---|---|"
            for f in out/*.apk; do
              printf '| %s | %s | %s |\n' "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -c1-16)…"
            done
            echo
            echo "versionName: \`$VERSION\` · commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlayOps-debug-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Release (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            APK debug OverlayOps. Butuh Shizuku untuk mengubah AppOps tersembunyi.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

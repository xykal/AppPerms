name: Deploy production website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check-version-sync.sh"
      - "scripts/check_release_integrity.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appsperms-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Validate release metadata and download routing
        run: bash scripts/check-version-sync.sh

      - name: Deploy immutable source revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.152.0 pages deploy docs \
            --project-name=appsperms \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=false

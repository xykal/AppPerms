name: Deploy download Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appsperms-download-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Worker/R2 gateway
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Test Worker
        working-directory: workers/dl-worker
        run: npm run check

      - name: Deploy Worker and custom domain
        working-directory: workers/dl-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.152.0 deploy --env production

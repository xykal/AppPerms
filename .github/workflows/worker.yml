name: Deploy download Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appsperms-download-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Worker/R2 gateway
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test Worker
        working-directory: workers/dl-worker
        run: npm run check

      - name: Deploy Worker and custom domain
        working-directory: workers/dl-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.152.0 deploy --env production

name: Web, release and Worker checks

on:
  # This workflow supplies a required status check, so it must run for every PR.
  # Path filters would leave dependency-only PRs permanently blocked.
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "design/illustrations/**"
      - "app/src/main/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "workers/**"
      - "gradle.properties"
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Browser, metadata, assets and Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-illustrations.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install browser test tools
        run: |
          python -m pip install -r tools/requirements-illustrations.txt
          python -m playwright install --with-deps chromium

      - name: Validate release metadata
        run: bash scripts/check-version-sync.sh

      - name: Test download Worker
        working-directory: workers/dl-worker
        run: npm run check

      - name: Validate assets, HTML and browser behavior
        env:
          ILLUSTRATION_SCREENSHOTS: out/illustration-smoke
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Retain UI review screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-smoke-${{ github.sha }}
          path: out/illustration-smoke/*.png
          if-no-files-found: ignore
          retention-days: 7

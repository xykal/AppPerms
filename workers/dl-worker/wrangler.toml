name = "appsperms-dl"
main = "src/index.js"
compatibility_date = "2026-10-22"
workers_dev = false

# `wrangler deploy --env production` provisions the custom hostname through
# Workers Custom Domains instead of relying on a standalone proxied DNS record.
[env.production]
name = "appsperms-dl"
routes = [
  { pattern = "dl.appsperms.xyverse.my.id", custom_domain = true }
]

[vars]
MAIN_SITE_URL = "https://appsperms.xyverse.my.id/"
RELEASE_MANIFEST_URL = "https://appsperms.xyverse.my.id/data/release.json"
MIRROR_TIMEOUT_MS = "8000"

[env.production.vars]
MAIN_SITE_URL = "https://appsperms.xyverse.my.id/"
RELEASE_MANIFEST_URL = "https://appsperms.xyverse.my.id/data/release.json"
MIRROR_TIMEOUT_MS = "8000"

[[r2_buckets]]
binding = "APK_BUCKET"
bucket_name = "appsperms-apk"
preview_bucket_name = "appsperms-apk-preview"

[[env.production.r2_buckets]]
binding = "APK_BUCKET"
bucket_name = "appsperms-apk"
preview_bucket_name = "appsperms-apk-preview"

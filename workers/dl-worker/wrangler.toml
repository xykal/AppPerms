name = "appsperms-dl"
main = "src/index.js"
compatibility_date = "2026-10-22"
workers_dev = false

# `production` is the no-R2, digest-verified GitHub fallback. `production_r2`
# binds the optional R2 primary. Both provision the same Workers Custom Domain.
[env.production]
name = "appsperms-dl"
routes = [
  { pattern = "dl.appsperms.xyverse.my.id", custom_domain = true }
]

[vars]
MAIN_SITE_URL = "https://appsperms.xyverse.my.id/"
RELEASE_MANIFEST_URL = "https://appsperms.xyverse.my.id/data/release.json"
MIRROR_TIMEOUT_MS = "8000"

[env.production.vars]
MAIN_SITE_URL = "https://appsperms.xyverse.my.id/"
RELEASE_MANIFEST_URL = "https://appsperms.xyverse.my.id/data/release.json"
MIRROR_TIMEOUT_MS = "8000"

[env.production_r2]
name = "appsperms-dl"
routes = [
  { pattern = "dl.appsperms.xyverse.my.id", custom_domain = true }
]

[env.production_r2.vars]
MAIN_SITE_URL = "https://appsperms.xyverse.my.id/"
RELEASE_MANIFEST_URL = "https://appsperms.xyverse.my.id/data/release.json"
MIRROR_TIMEOUT_MS = "8000"

[[env.production_r2.r2_buckets]]
binding = "APK_BUCKET"
bucket_name = "appsperms-apk"
preview_bucket_name = "appsperms-apk-preview"
